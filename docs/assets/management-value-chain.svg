<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880" role="img" aria-labelledby="title desc">
  <title id="title">ECOS management value and benefits realization</title>
  <desc id="desc">Operational data creates visibility, which enables decisions and controlled action. Balanced scorecard perspectives track financial stewardship, customer experience, internal operations and learning. Benefits require baseline measurement, ownership and post-pilot verification; no savings or health improvements are asserted.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526f84"/></marker><style>text{font-family:Arial,sans-serif;fill:#12354a}.title{font-size:30px;font-weight:bold}.h{font-size:21px;font-weight:bold}.t{font-size:18px}.s{font-size:16px}.b{fill:#fff;stroke:#95b3c9;stroke-width:2}.l{fill:none;stroke:#526f84;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1480" height="880" rx="18" fill="#f3f7fa"/>
  <text x="45" y="54" class="title">ECOS | From integrated demo to managed business value</text>
  <text x="45" y="88" class="t">Management hypotheses and evaluation framework, not measured benefits</text>
  <rect x="45" y="145" width="305" height="145" rx="14" class="b"/><text x="70" y="185" class="h">Operational evidence</text><text x="70" y="220" class="t">Orders, stock movements</text><text x="70" y="252" class="t">Recipes, feedback, history</text><text x="70" y="278" class="s">Reliable definitions and provenance</text>
  <rect x="405" y="145" width="305" height="145" rx="14" class="b"/><text x="430" y="185" class="h">Decision visibility</text><text x="430" y="220" class="t">Dashboards, forecasts</text><text x="430" y="252" class="t">Risks and read-only answers</text><text x="430" y="278" class="s">Understand uncertainty and limits</text>
  <rect x="765" y="145" width="305" height="145" rx="14" class="b"/><text x="790" y="185" class="h">Accountable action</text><text x="790" y="220" class="t">Adjust prep and menu</text><text x="790" y="252" class="t">Replenish, resolve concerns</text><text x="790" y="278" class="s">Named owner and decision record</text>
  <rect x="1125" y="145" width="305" height="145" rx="14" fill="#e9f8f2" stroke="#7ea998" stroke-width="2"/><text x="1150" y="185" class="h">Evaluated outcomes</text><text x="1150" y="220" class="t">Service and resource use</text><text x="1150" y="252" class="t">Experience and adoption</text><text x="1150" y="278" class="s">Compare baseline and pilot evidence</text>
  <path d="M350 215 H405" class="l"/><path d="M710 215 H765" class="l"/><path d="M1070 215 H1125" class="l"/>
  <text x="45" y="366" class="h">Balanced scorecard: proposed management ownership</text>
  <rect x="45" y="400" width="665" height="125" rx="14" class="b"/><text x="70" y="439" class="h">Financial stewardship | Sponsor + Finance</text><text x="70" y="474" class="t">Cost-to-serve, inventory loss and benefit realization</text><text x="70" y="504" class="s">Current demo order values are not collected cash or profit</text>
  <rect x="765" y="400" width="665" height="125" rx="14" class="b"/><text x="790" y="439" class="h">Customer | Cafeteria manager + HR</text><text x="790" y="474" class="t">Feedback, repeat ordering, inclusion and useful guidance</text><text x="790" y="504" class="s">Adoption metrics do not prove improved clinical health</text>
  <rect x="45" y="560" width="665" height="125" rx="14" class="b"/><text x="70" y="599" class="h">Internal process | Operations owner</text><text x="70" y="634" class="t">Availability, fulfillment, stock accuracy and forecast error</text><text x="70" y="664" class="s">Direct waste measurement and procurement controls remain future work</text>
  <rect x="765" y="560" width="665" height="125" rx="14" class="b"/><text x="790" y="599" class="h">Learning + governance | Project / data owner</text><text x="790" y="634" class="t">Training, definition quality, consent and model monitoring</text><text x="790" y="664" class="s">Human review and staged rollout before scaling</text>
  <path d="M1275 290 V330 H1450 V735 H190 V290" class="l"/>
  <text x="255" y="764" class="t">Feedback loop: observed results revise assumptions, thresholds, training and the operating process.</text>
  <text x="45" y="818" class="s">Suggested governance cadence: pre-service stock review; daily exceptions; weekly demand and feedback; monthly sponsor benefits review.</text>
  <text x="45" y="850" class="s">Every proposed target, owner and cadence must be approved locally. This diagram does not assert an existing organizational policy.</text>
</svg>
